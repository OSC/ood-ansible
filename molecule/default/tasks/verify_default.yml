- name: Copy custom cluster files to container
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: 'u=rw,g=r,o=r'
  with_items:
    - { src: "fixtures/ondemand.d/ondemand_default.yml", dest: "ondemand.yml" }

- name: Verify config files
  ansible.builtin.command: "diff /tmp/{{ item.left }} {{ item.right }}"
  with_items:
    - { left: "ondemand.yml", right: "{{ ood_base_conf_dir }}/ondemand.d/ondemand.yml" }
  changed_when: false

- name: Get the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure the ondemand-release-web package is installed
  ansible.builtin.fail:
    msg: ondemand-release-web package was not installed.
  when: "'ondemand-release-web' not in ansible_facts.packages"