---
- name: Converge
  hosts: default
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: vars/install.yml
    - name: run rule
      ansible.builtin.include_role:
        name: ood-ansible

# Custom is the use case of providing custom variables. Most
# variables should be supplied here to differ from default to
# verify templating.
- name: Custom
  hosts: custom
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/apps.yml
        - vars/nginx.yml
        - vars/portal.yml
        - vars/ondemand.yml
        - vars/install.yml
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible

- name: OIDC
  hosts: oidc
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/oidc_portal.yml
        - vars/install.yml
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible

# Old Variables is the use case of providing old variable names
# (not ood_ prefixed) to ensure backward compatibility.
# All old variables should be supplied here to differ from default to
# verify templating.
- name: Old Variables
  hosts: old-variables
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/install.yml
        - vars/old_variables.yml
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible