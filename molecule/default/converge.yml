---
- name: Converge
  hosts: default
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: vars/install.yml
    - name: run rule
      ansible.builtin.include_role:
        name: ood-ansible

# Custom is the use case of providing custom variables. Most
# variables should be supplied here to differ from default to
# verify templating.
- name: Custom
  hosts: custom
  tasks:
    - name: include global vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/apps.yml
        - vars/nginx.yml
        - vars/portal.yml
        - vars/ondemand.yml
    - name: Include variables for running locally
      ansible.builtin.include_vars:
        file: install_custom_local.yml
      when: "lookup('ansible.builtin.env', 'CI') != 'true'"
    - name: Include variables for running in CI (use locked staging repository)
      ansible.builtin.include_tasks:
        file: ci.yml
      when: "lookup('ansible.builtin.env', 'CI') == 'true'"
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible
      vars:
          ood_web_repo_user: "{{ lookup('ansible.builtin.env', 'OSC_EARLY_ACCESS_USER', default=undef()) }}"
          ood_web_repo_password: "{{ lookup('ansible.builtin.env', 'OSC_EARLY_ACCESS_PASSWORD', default=undef()) }}"
          ood_web_src_repo_user: "{{ lookup('ansible.builtin.env', 'OSC_EARLY_ACCESS_USER', default=undef()) }}"
          ood_web_src_repo_password: "{{ lookup('ansible.builtin.env', 'OSC_EARLY_ACCESS_PASSWORD', default=undef()) }}"

- name: OIDC
  hosts: oidc
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/oidc_portal.yml
        - vars/install.yml
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible

# Old Variables is the use case of providing old variable names
# (not ood_ prefixed) to ensure backward compatibility.
# All old variables should be supplied here to differ from default to
# verify templating.
- name: Old Variables
  hosts: old-variables
  tasks:
    - name: include vars
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - vars/install.yml
        - vars/old_variables.yml
    - name: run role
      ansible.builtin.include_role:
        name: ood-ansible