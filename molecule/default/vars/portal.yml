# custom ood_portal.yml configurations

ood_httpd_use_rewrites: false

host_regex: 'forge-(l|c)\d+'
# nobody's should be using both user_* configs here, but this is a test after all
user_map_cmd: '/opt/site/regex-mapper --regex=''''^([A-Za-z0-9\-_\.]+)@osc.edu$'''''
user_map_match: '^([^@]+)@.*$'
rnode_uri: '/custom-rnode-path'
node_uri: '/custom-node-path'
oidc_uri: '/custom-oidc-path'
secure_node_uri: '/custom-secure-node'
secure_rnode_uri: '/custom-secure-rnode'
ssl_proxy:
  - 'SSLProxyCheckPeerCN Off'
  - 'SSLProxyCheckPeerName Off'
httpd_error_log: 'custom_defined_error.log'
httpd_access_log: 'custom_defined_access.log'
httpd_logformat: '"%O %h \"%{Referer}i\" \"%r\" %v \"%{User-Agent}i\" %{SSL_PROTOCOL}e %T %>s"'
security_csp_frame_ancestors: http://my.proxy.server.edu
security_strict_transport: true
pun_pre_hook_exports: 'OIDC_ACCESS_TOKEN,OIDC_CLAIM_EMAIL'
pun_pre_hook_root_cmd: '/opt/site/site_pre_hook'

custom_vhost_directives:
  - '<Location "/test">'
  - '  SetEnv SPECIAL_PATH /foo/bin'
  - '</Location>'

custom_location_directives:
  - 'SetEnv SPECIAL_PATH /foo/bin'

server_aliases:
  - other-site.notrealdoman.edu

ood_auth_openidc:
  OIDCSessionMaxDuration: 28888
  OIDCClientID: myid
  OIDCProviderMetadataURL: https://localhost/
  OIDCCryptoPassphrase: mycryptopass

strip_proxy_cookies: ["mod_auth_openidc_session"]
strip_proxy_headers: ["Authorization", "OIDC_access_token"]

register_method: Alias
register_method_options:
  - 'WSGIDaemonProcess register user=www-data group=www-data threads=5 home=/var/www/flask-apps/register'

dex_settings: |
  dex:
    # Default based on if ssl key for ood-portal-generator is defined
    ssl: false
    # Only used if SSL is disabled
    http_port: "5556"
    # Only used if SSL is enabled
    https_port: "5554"
    # tls_cert and tls_key take OnDemand configured values for ssl and copy keys to /etc/ood/dex maintaining file names
    tls_cert: null
    tls_key: null
    storage_file: /etc/ood/dex/dex.db
    grpc: null
    expiry: null
    # Client ID, defaults to servername or FQDN
    client_id: null
    client_name: OnDemand
    # Client secret, value auto generated
    # A value that is a filesystem path can be used to store secret in a file
    client_secret: /etc/ood/dex/ondemand.secret
    # The OnDemand redirectURI is auto-generated, this option allows adding additional URIs
    client_redirect_uris: []
    # Additional Dex OIDC clients to configure
    static_clients: []
    # The following example is to configure OpenLDAP
    # Docs: https://github.com/dexidp/dex/blob/master/Documentation/connectors/ldap.md
    connectors:
      - type: ldap
        id: ldap
        name: LDAP
        config:
          host: openldap.my_center.edu:636
          insecureSkipVerify: false
          bindDN: cn=admin,dc=example,dc=org
          bindPW: admin
          userSearch:
            baseDN: ou=People,dc=example,dc=org
            filter: "(objectClass=posixAccount)"
            username: uid
            idAttr: uid
            emailAttr: mail
            nameAttr: gecos
            preferredUsernameAttr: uid
          groupSearch:
            baseDN: ou=Groups,dc=example,dc=org
            filter: "(objectClass=posixGroup)"
            userMatchers:
              - userAttr: DN
                groupAttr: member
            nameAttr: cn
    frontend:
      theme: ondemand
      dir: /usr/share/ondemand-dex/web